<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android Waitlist | PandaPaus</title>
  <meta name="description" content="PandaPaus is coming to Android. Join the waitlist to be notified the moment it's available." />
  <meta property="og:title" content="PandaPaus – Android Waitlist" />
  <meta property="og:description" content="Join the waitlist to be notified the moment PandaPaus is available on Android." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="/assets/finalapp2.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,800;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal:       #39a79e;
      --teal-light: #e8f6f5;
      --teal-mid:   #c0e8e5;
      --soft-white: #f9f9f9;
      --text-gray:  #393939;
      --light-gray: #9a9a9a;
      --white:      #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Figtree', sans-serif;
      background: var(--soft-white);
      color: var(--text-gray);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    .navbar {
      width: 100%;
      height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8%;
      background: var(--soft-white);
      border-bottom: 1px solid rgba(57,167,158,0.12);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
    }

    .nav-logo-text {
      color: var(--teal);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      color: var(--teal);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .nav-link:hover { opacity: 1; }

    .nav-download {
      background: var(--teal);
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 9px 20px;
      border-radius: 100px;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .nav-download:hover { opacity: 0.85; }

    .nav-hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }

    .nav-hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--teal);
      border-radius: 2px;
      transition: all 0.2s;
    }

    @media (max-width: 540px) {
      .nav-hamburger { display: flex; }

      .nav-right {
        display: none;
        position: absolute;
        top: 72px;
        left: 0;
        right: 0;
        background: var(--soft-white);
        flex-direction: column;
        align-items: center;
        gap: 0;
        border-bottom: 1px solid rgba(57,167,158,0.12);
        padding: 16px 0;
        z-index: 999;
      }

      .nav-right.open {
        display: flex;
      }

      .nav-link {
        padding: 12px 0;
        width: 100%;
        text-align: center;
      }

      .nav-download {
        margin-top: 8px;
      }
    }

    /* ── WAITLIST PAGE ── */
    .waitlist-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 5%;
    }

    .waitlist-card {
      background: var(--white);
      border-radius: 24px;
      padding: 56px 44px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.08);
    }

    .waitlist-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--teal-light);
      color: var(--teal);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    .waitlist-card h1 {
      font-size: clamp(1.7rem, 4vw, 2.1rem);
      font-weight: 800;
      color: var(--text-gray);
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    .waitlist-card p {
      font-size: 0.98rem;
      color: var(--light-gray);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .modal-input {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid rgba(57,167,158,0.3);
      border-radius: 12px;
      font-family: 'Figtree', sans-serif;
      font-size: 1rem;
      color: var(--text-gray);
      background: var(--soft-white);
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 14px;
    }

    .modal-input:focus {
      border-color: var(--teal);
    }

    .modal-submit {
      width: 100%;
      background: var(--teal);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-family: 'Figtree', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .modal-submit:hover { opacity: 0.85; }
    .modal-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal-message {
      margin-top: 14px;
      font-size: 0.9rem;
      min-height: 20px;
    }

    .modal-message.success { color: var(--teal); }
    .modal-message.error   { color: #e05c5c; }

    /* ── FOOTER ── */
    footer {
      padding: 2.5rem 8%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.82rem;
      color: var(--light-gray);
      border-top: 1px solid rgba(57,167,158,0.1);
      flex-wrap: wrap;
      gap: 10px;
    }

    @media (max-width: 600px) {
      .navbar { padding: 0 5%; }
      .waitlist-card { padding: 40px 28px; }
      footer { padding: 2rem 5%; flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="navbar">
    <a href="/" class="nav-logo">
      <img src="/assets/finalapp2.png" alt="PandaPaus" />
      <span class="nav-logo-text">PandaPaus</span>
    </a>
    <div class="nav-right" id="navRight">
      <a href="/android-waitlist/" class="nav-link">Android Waitlist</a>
      <a href="/contact/" class="nav-link">Contact</a>
      <a href="https://apps.apple.com/us/app/pandapaus-screen-time-control/id6760516623" class="nav-download" target="_blank" rel="noopener">Download PandaPaus</a>
    </div>
    <button class="nav-hamburger" id="navHamburger" onclick="toggleNav()" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- WAITLIST -->
  <main class="waitlist-page">
    <div class="waitlist-card">
      <span class="waitlist-badge">Coming soon on Android</span>
      <h1>Android is coming.</h1>
      <p>Drop your email and we'll let you know the moment PandaPaus is available for Android.</p>
      <input
        class="modal-input"
        type="email"
        id="waitlistEmail"
        placeholder="your@email.com"
        autocomplete="email"
      />
      <button class="modal-submit" id="waitlistBtn" onclick="submitWaitlist()">Add me to the waitlist</button>
      <p class="modal-message" id="waitlistMsg"></p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <span>© 2026 Modern 21 LLC</span>
  </footer>

  <script>
    // ── Same Apps Script URL used site-wide ──
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzciVdhyGwK6goK2Wn40uZ6Ixqmra9fJ1WFezC4AyqFDkcRLVHbwna7OeWO6ITELka0/exec";

    function toggleNav() {
      document.getElementById("navRight").classList.toggle("open");
    }

    document.addEventListener("click", function(e) {
      const nav = document.getElementById("navRight");
      const btn = document.getElementById("navHamburger");
      if (!nav.contains(e.target) && !btn.contains(e.target)) {
        nav.classList.remove("open");
      }
    });

    async function submitWaitlist() {
      const email = document.getElementById("waitlistEmail").value.trim();
      const btn   = document.getElementById("waitlistBtn");
      const msg   = document.getElementById("waitlistMsg");

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.textContent = "Please enter a valid email address.";
        msg.className = "modal-message error";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending…";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ type: "android_waitlist", email }),
        });
        msg.textContent = "You're on the list. We'll be in touch!";
        msg.className = "modal-message success";
        btn.textContent = "Done ✓";
      } catch {
        msg.textContent = "Something went wrong. Try again.";
        msg.className = "modal-message error";
        btn.disabled = false;
        btn.textContent = "Notify me";
      }
    }
  </script>

</body>
</html>
